plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.android'
}

android {
    // This copy's own signing key (keystore.properties + the keystore file, kept out of git); without it the
    // build is signed with the standard debug key.
    def ks = rootProject.file('keystore.properties')
    signingConfigs {
        if (ks.exists()) {
            release {
                def p = new Properties()
                ks.withInputStream { p.load(it) }
                storeFile rootProject.file(p.getProperty('storeFile'))
                storePassword p.getProperty('storePassword')
                keyAlias p.getProperty('keyAlias')
                keyPassword p.getProperty('keyPassword')
            }
        }
    }
    compileSdkVersion 34
    defaultConfig {
        // own ID, so this copy installs next to the official BCU app (com.mandarin.bcu)
        applicationId "com.mandarin.bcu.kr"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "0.18.13-kr1" // BCU Android 0.18.13 + this copy's changes (core 0.7.20.0, Korean data)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        android.buildFeatures.buildConfig = true
        buildConfigField "String", "YOU_CANT_FIND_PASSWORD", "\"" + getPassword() + "\""
        signingConfig ks.exists() ? signingConfigs.release : signingConfigs.debug
    }
    buildTypes {
        debug {
            debuggable true
            buildConfigField "Boolean", "DEBUG_MODE", "true"
        }
        release {
            debuggable true
            getIsDefault().set(true)
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0', 'META-INF/CONTRIBUTORS.md', 'META-INF/LICENSE.md', 'META-INF/*.kotlin_module']
        }
    }

    buildFeatures {
        viewBinding true
    }

    namespace 'com.mandarin.bcu'

    packagingOptions { resources.excludes.add("META-INF/*") }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.13'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.wear:wear:1.3.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'pub.devrel:easypermissions:3.0.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'com.google.apis:google-api-services-drive:v3-rev20230815-2.0.0'
    implementation 'com.google.api-client:google-api-client:2.4.0'
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.23.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.nhaarman.supertooltips:library:3.0.0'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
    annotationProcessor 'org.androidannotations:androidannotations:4.8.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'


    implementation "androidx.media3:media3-exoplayer:1.3.0"
    implementation "androidx.media3:media3-exoplayer-dash:1.3.0"
    implementation "androidx.media3:media3-ui:1.3.0"
}

repositories {
    mavenCentral()
}

def getPassword() {
    // (the BCU developers' setting; this copy builds without it)
    def f = project.rootProject.file('local.properties')
    if (!f.exists()) return ""
    Properties properties = new Properties()
    properties.load(f.newDataInputStream())
    return properties.getProperty("password", "")
}
